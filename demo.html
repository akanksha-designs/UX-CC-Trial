<!DOCTYPE html>

      document.documentElement.setAttribute('data-theme', t);

</head>
<body>
  <header class="site-header">
    <nav class="nav">

      <button class="theme-toggle" aria-label="Toggle light/dark mode" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);})()">

        </svg>
      </button>
    </nav>

  <main>
    <section class="hero" style="min-height: calc(100vh - 64px); display: flex; flex-direction: column; justify-content: center;">

      <p style="color: var(--color-muted); font-size: 18px; max-width: 520px; line-height: 1.7; margin-bottom: 40px;">
        Start vibe-coding — bring a Figma frame, share it with Claude, and watch the design land in code. Live.
      </p>
      <div style="display: flex; gap: 16px; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary">How it works</a>
