<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="12" fill="#0d0d0f"/>
  <!-- Chrome -->
  <rect width="900" height="44" fill="#1a1a22"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#febc2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="450" y="27" font-family="SF Pro, system-ui, sans-serif" font-size="13" fill="#7a7a8a" text-anchor="middle">Terminal — zsh</text>
  <!-- Prompt line indicator -->
  <rect x="0" y="44" width="4" height="476" fill="#7c6ef7" opacity="0.5"/>
  <text x="32" y="90" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Navigate to your projects folder</text>
  <text x="32" y="112" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ cd /Users/yourname/Explorations</text>
  <text x="32" y="134" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="156" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Clone the repository from GitHub</text>
  <text x="32" y="178" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git clone https://github.com/akanksha-designs/UX-CC-Trial.git</text>
  <text x="32" y="200" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Cloning into 'UX-CC-Trial'...</text>
  <text x="32" y="222" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ remote: Enumerating objects: 15, done.</text>
  <text x="32" y="244" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Receiving objects: 100% (15/15), 4.65 KiB | 2.33 MiB/s, done.</text>
  <text x="32" y="266" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="288" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Move into the project folder</text>
  <text x="32" y="310" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ cd UX-CC-Trial</text>
  <text x="32" y="332" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="354" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Set your identity (first time only)</text>
  <text x="32" y="376" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git config user.name "Your Name"</text>
  <text x="32" y="398" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git config user.email "you@example.com"</text>
  <text x="32" y="420" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="442" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Start local dev server</text>
  <text x="32" y="464" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ python3 -m http.server 3001</text>
  <text x="32" y="486" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Serving HTTP on 0.0.0.0 port 3001 ...</text>
  
</svg>