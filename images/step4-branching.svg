<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="12" fill="#0d0d0f"/>
  <!-- Chrome -->
  <rect width="900" height="44" fill="#1a1a22"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#febc2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="450" y="27" font-family="SF Pro, system-ui, sans-serif" font-size="13" fill="#7a7a8a" text-anchor="middle">Terminal — branching strategy</text>
  <!-- Prompt line indicator -->
  <rect x="0" y="44" width="4" height="476" fill="#7c6ef7" opacity="0.5"/>
  <text x="32" y="90" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Always start from the latest main</text>
  <text x="32" y="112" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git checkout main</text>
  <text x="32" y="134" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Switched to branch 'main'</text>
  <text x="32" y="156" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="178" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git pull origin main</text>
  <text x="32" y="200" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Already up to date.</text>
  <text x="32" y="222" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="244" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Create a new branch for your design change</text>
  <text x="32" y="266" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git checkout -b design/update-hero-colours</text>
  <text x="32" y="288" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Switched to a new branch 'design/update-hero-colours'</text>
  <text x="32" y="310" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="332" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Confirm you're on the right branch</text>
  <text x="32" y="354" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git branch</text>
  <text x="32" y="376" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→   main</text>
  <text x="32" y="398" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ * design/update-hero-colours   ← you are here</text>
  <text x="32" y="420" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="442" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Now make changes — main stays untouched</text>
  <text x="32" y="464" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Each branch → separate Vercel preview URL</text>
  
</svg>