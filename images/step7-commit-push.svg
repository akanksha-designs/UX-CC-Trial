<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="12" fill="#0d0d0f"/>
  <!-- Chrome -->
  <rect width="900" height="44" fill="#1a1a22"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="6" fill="#febc2e"/>
  <circle cx="62" cy="22" r="6" fill="#28c840"/>
  <text x="450" y="27" font-family="SF Pro, system-ui, sans-serif" font-size="13" fill="#7a7a8a" text-anchor="middle">Terminal — commit, push, open PR</text>
  <!-- Prompt line indicator -->
  <rect x="0" y="44" width="4" height="476" fill="#7c6ef7" opacity="0.5"/>
  <text x="32" y="90" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Stage all changed files</text>
  <text x="32" y="112" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git add .</text>
  <text x="32" y="134" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="156" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Commit with a clear message</text>
  <text x="32" y="178" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git commit -m "Update hero colour to Primary/500 from Figma tokens"</text>
  <text x="32" y="200" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ [design/update-hero-colours 3f7a2c1] Update hero colour...</text>
  <text x="32" y="222" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ 1 file changed, 2 insertions(+), 2 deletions(-)</text>
  <text x="32" y="244" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="266" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Push the branch to GitHub</text>
  <text x="32" y="288" font-family="SF Mono, monospace" font-size="13" fill="#28c840">$ git push -u origin design/update-hero-colours</text>
  <text x="32" y="310" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ Branch set up to track remote branch.</text>
  <text x="32" y="332" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→ To https://github.com/akanksha-designs/UX-CC-Trial.git</text>
  <text x="32" y="354" font-family="SF Mono, monospace" font-size="13" fill="#7c6ef7">→  * [new branch]  design/update-hero-colours → design/update-hero-colours</text>
  <text x="32" y="376" font-family="SF Mono, monospace" font-size="13" fill="#e8e8ed"></text>
  <text x="32" y="398" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Go to GitHub → you'll see: 'Compare & pull request'</text>
  <text x="32" y="420" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Fill in: what changed, Figma link, before/after screenshots</text>
  <text x="32" y="442" font-family="SF Mono, monospace" font-size="13" fill="#7a7a8a"># Submit PR → Vercel posts a preview URL automatically</text>
  
</svg>